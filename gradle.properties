# Gradle build JVM. 2G is enough for this small project.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false

# ForgeGradle contacts Mojang / Forge servers during configuration. On networks where
# that check hangs (corporate proxies, some CN ISPs) uncomment the next two lines.
# systemProp.forgegradle.env_check=false
# systemProp.net.minecraftforge.gradle.check.certs=false
